<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Market - Favoritlərim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-2xl font-black text-indigo-600">AZ<span class="text-orange-500">Market</span></h1>
            <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-indigo-600 flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Ana səhifəyə qayıt
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
            <i class="fa-solid fa-heart text-red-500"></i> Bəyəndiyiniz Məhsullar
        </h2>

        <div id="wishlist-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            <!-- JS ilə dolacaq -->
        </div>
    </main>

    <script>
        function getWishlist() {
            return JSON.parse(localStorage.getItem('az_market_wishlist')) || [];
        }

        function renderWishlist() {
            const wishlist = getWishlist();
            const grid = document.getElementById('wishlist-grid');

            if (wishlist.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-12">Hələ heç bir məhsulu favoritlərə əlavə etməmisiniz.</p>';
                return;
            }

            grid.innerHTML = wishlist.map(item => `
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between">
                    <div class="relative">
                        <img src="${item.img}" class="w-full h-40 object-cover">
                        <button onclick="removeFromWishlist(${item.id})" class="absolute top-2 right-2 bg-white/80 p-1.5 rounded-full text-red-500 hover:bg-white">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-[10px] font-semibold text-indigo-600 uppercase">${item.store || 'AZ Market'}</span>
                            <h4 class="text-xs sm:text-sm font-medium text-gray-800 line-clamp-2 mt-0.5">${item.title}</h4>
                        </div>
                        <div class="mt-3 flex items-center justify-between">
                            <span class="text-sm font-bold text-gray-900">${item.price} ₼</span>
                            <a href="mehsul.html?id=${item.id}" class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-indigo-600 hover:text-white transition-colors">
                                Bax
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function removeFromWishlist(id) {
            let wishlist = getWishlist();
            wishlist = wishlist.filter(item => item.id !== id);
            localStorage.setItem('az_market_wishlist', JSON.stringify(wishlist));
            renderWishlist();
        }

        renderWishlist();
    </script>
</body>
</html>
