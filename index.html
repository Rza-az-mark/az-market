<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Market - Azərbaycan Onlayn Marketplace</title>
    <!-- Tailwind CSS (Pulsuz vizual stil kitabxanası) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header (Yuxarı menyu) -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-2xl font-bold text-indigo-600">AZ Market</h1>
            <input type="text" placeholder="Məhsul və ya mağaza axtarın..." class="w-1/2 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex space-x-4">
                <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg">Giriş</button>
                <button class="px-4 py-2 border rounded-lg">Səbət (0)</button>
            </div>
        </div>
    </header>

    <!-- Banner / Vitrin -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-indigo-600 text-white p-8 rounded-2xl mb-8 text-center">
            <h2 class="text-3xl font-extrabold mb-2">Azərbaycanın Yeni Marketplace Platforması</h2>
            <p class="text-indigo-100">Sevdiyiniz mağazaların məhsulları tək məkanda!</p>
        </div>

        <!-- Məhsul Kartları (Nümunə) -->
        <h3 class="text-xl font-bold mb-4 text-gray-800">Seçilən Məhsullar</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
            
            <!-- 1-ci Məhsul -->
            <div class="bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition">
                <div class="w-full h-48 bg-gray-200 rounded-lg mb-4 flex items-center justify-center text-gray-400">Şəkil</div>
                <span class="text-xs font-semibold bg-indigo-100 text-indigo-800 px-2 py-1 rounded">TrendyStore</span>
                <h4 class="font-bold mt-2 text-gray-800">Kabelsiz Qulaqlıq</h4>
                <p class="text-indigo-600 font-bold mt-1">49.99 AZN</p>
                <button class="w-full mt-4 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">Səbətə at</button>
            </div>

            <!-- 2-ci Məhsul -->
            <div class="bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition">
                <div class="w-full h-48 bg-gray-200 rounded-lg mb-4 flex items-center justify-center text-gray-400">Şəkil</div>
                <span class="text-xs font-semibold bg-green-100 text-green-800 px-2 py-1 rounded">BakuTech</span>
                <h4 class="font-bold mt-2 text-gray-800">Smart Saat</h4>
                <p class="text-indigo-600 font-bold mt-1">89.00 AZN</p>
                <button class="w-full mt-4 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">Səbətə at</button>
            </div>

        </div>
    </main>

</body>
</html>
