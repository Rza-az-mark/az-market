<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Market - Multi-Vendor Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <h1 class="text-2xl font-black text-indigo-600 tracking-wide">AZ<span class="text-orange-500">Market</span></h1>
            
            <div class="flex-1 max-w-md relative">
                <input type="text" id="search-input" oninput="filterProducts()" placeholder="Məhsul, marka və ya kateqoriya axtarın..." class="w-full bg-gray-100 text-sm py-2 px-4 pr-10 rounded-full focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <i class="fa-solid fa-magnifying-glass absolute right-3 top-2.5 text-gray-400"></i>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="toggleCart()" class="relative bg-gray-100 hover:bg-gray-200 text-gray-700 p-2.5 rounded-full transition-colors">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-orange-500 text-white text-[10px] font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
                </button>

                <a href="satici.html" class="bg-orange-500 hover:bg-orange-600 text-white font-medium text-xs sm:text-sm px-3 py-2 rounded-lg transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-store"></i>
                    <span class="hidden sm:inline">Satıcı Ol</span>
                </a>
            </div>
        </div>

        <div class="border-t overflow-x-auto whitespace-nowrap px-4 py-2 text-sm text-gray-600 flex gap-6 max-w-6xl mx-auto" id="categories-bar">
            <span onclick="filterCategory('Hamısı')" class="cat-btn font-bold text-indigo-600 cursor-pointer border-b-2 border-indigo-600 pb-1">Hamısı</span>
            <span onclick="filterCategory('Geyim & Moda')" class="cat-btn cursor-pointer hover:text-indigo-600">Geyim & Moda</span>
            <span onclick="filterCategory('Elektronika')" class="cat-btn cursor-pointer hover:text-indigo-600">Elektronika</span>
            <span onclick="filterCategory('Ev & Yaşam')" class="cat-btn cursor-pointer hover:text-indigo-600">Ev & Yaşam</span>
            <span onclick="filterCategory('Kosmetika')" class="cat-btn cursor-pointer hover:text-indigo-600">Kosmetika & Baxım</span>
        </div>
    </header>

    <div class="max-w-6xl mx-auto px-4 my-4">
        <div class="bg-gradient-to-r from-indigo-600 to-orange-500 text-white rounded-2xl p-6 shadow-md flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <span class="bg-white/20 text-xs px-2.5 py-1 rounded-full uppercase tracking-wider font-semibold">Mövsüm Endirimləri</span>
                <h2 class="text-2xl sm:text-3xl font-extrabold mt-2">Seçilmiş Məhsullarda 50%-dək Endirim!</h2>
                <p class="text-sm opacity-90 mt-1">Azərbaycanın yerli satıcılarından ən keyfiyyətli məhsullar.</p>
            </div>
            <button class="bg-white text-indigo-600 font-bold px-6 py-2.5 rounded-xl shadow hover:bg-gray-50 transition-colors whitespace-nowrap">Kəşf Et</button>
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-4 pb-12">
        <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-fire text-orange-500"></i> Bütün Məhsullar
        </h3>

        <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- JS ilə yüklənəcək -->
        </div>
    </main>

    <!-- Səbət Modalı -->
    <div id="cart-modal" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity">
        <div class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-xl flex flex-col justify-between">
            <div class="p-4 border-b flex items-center justify-between bg-gray-50">
                <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-indigo-600"></i> Səbətim
                </h3>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600 text-xl font-bold p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="cart-items" class="p-4 flex-1 overflow-y-auto space-y-4">
                <p class="text-center text-gray-500 my-8">Səbəsiniz boşdur.</p>
            </div>

            <div class="p-4 border-t bg-gray-50 space-y-3">
                <div class="flex justify-between items-center text-base font-bold text-gray-800">
                    <span>Yekun Məbləğ:</span>
                    <span id="cart-total" class="text-xl text-indigo-600">0 ₼</span>
                </div>
                <button class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow transition-colors">
                    Sifarişi Rəsmiləşdir
                </button>
            </div>
        </div>
    </div>

    <script>
        const defaultProducts = [
            { id: 1, title: 'Simsiz Qulaqlıq Bluetooth 5.0', price: 36, category: 'Elektronika', store: 'TechStore', rating: 4.8, img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400' },
            { id: 2, title: 'Klassik Qol Saatı (Dəri Kəmər)', price: 89, category: 'Geyim & Moda', store: 'TimeKeeper', rating: 4.6, img: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400' },
            { id: 3, title: 'Qırmızı İdman Ayaqqabısı', price: 102, category: 'Geyim & Moda', store: 'SportZone', rating: 4.9, img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400' },
            { id: 4, title: 'Studio Səs Qulaqlığı', price: 145, category: 'Elektronika', store: 'AudioPro', rating: 4.7, img: 'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=400' }
        ];

        let selectedCategory = 'Hamısı';

        function getProducts() {
            const stored = localStorage.getItem('az_market_products');
            return stored ? JSON.parse(stored) : defaultProducts;
        }

        function renderProducts(items) {
            const grid = document.getElementById('products-grid');
            if(items.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10">Hiçbir məhsul tapılmadı.</p>';
                return;
            }
            grid.innerHTML = items.map(item => `
                <div class="bg-white rounded-xl shadow-sm border overflow-hidden flex flex-col justify-between hover:shadow-md transition-shadow">
                    <a href="mehsul.html?id=${item.id}" class="block relative">
                        <img src="${item.img}" alt="${item.title}" class="w-full h-40 object-cover">
                    </a>
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="text-[11px] font-semibold text-indigo-600 uppercase tracking-wide">${item.store || 'AZ Market'}</span>
                            <a href="mehsul.html?id=${item.id}" class="block text-xs sm:text-sm font-medium text-gray-800 line-clamp-2 mt-0.5 hover:text-indigo-600">${item.title}</a>
                            <div class="flex items-center gap-1 mt-1 text-xs text-amber-500">
                                <i class="fa-solid fa-star"></i>
                                <span class="font-bold text-gray-700">${item.rating || '5.0'}</span>
                            </div>
                        </div>
                        <div class="mt-3 flex items-center justify-between">
                            <p class="text-sm sm:text-base font-bold text-gray-900">${item.price} ₼</p>
                            <button onclick="addToCart(${item.id})" class="bg-indigo-50 text-indigo-600 p-2 rounded-lg hover:bg-indigo-600 hover:text-white transition-colors">
                                <i class="fa-solid fa-cart-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const products = getProducts();
            const filtered = products.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query);
                const matchesCat = selectedCategory === 'Hamısı' || p.category === selectedCategory;
                return matchesSearch && matchesCat;
            });
            renderProducts(filtered);
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.innerText.includes(cat)) {
                    btn.className = 'cat-btn font-bold text-indigo-600 cursor-pointer border-b-2 border-indigo-600 pb-1';
                } else {
                    btn.className = 'cat-btn cursor-pointer hover:text-indigo-600';
                }
            });
            filterProducts();
        }

        // Səbət məntiqi
        function getCart() {
            return JSON.parse(localStorage.getItem('az_market_cart')) || [];
        }
        function saveCart(cart) {
            localStorage.setItem('az_market_cart', JSON.stringify(cart));
            updateCartUI();
        }
        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }
        function addToCart(id) {
            const products = getProducts();
            const prod = products.find(p => p.id === id);
            let cart = getCart();
            const existing = cart.find(item => item.id === id);
            if(existing) { existing.quantity += 1; }
            else { cart.push({ ...prod, quantity: 1 }); }
            saveCart(cart);
        }
        function changeQuantity(id, delta) {
            let cart = getCart();
            const item = cart.find(i => i.id === id);
            if(item) {
                item.quantity += delta;
                if(item.quantity <= 0) cart = cart.filter(i => i.id !== id);
            }
            saveCart(cart);
        }
        function updateCartUI() {
            const cart = getCart();
            document.getElementById('cart-count').innerText = cart.reduce((s, i) => s + i.quantity, 0);
            document.getElementById('cart-total').innerText = cart.reduce((s, i) => s + (i.price * i.quantity), 0) + ' ₼';
            const itemsContainer = document.getElementById('cart-items');
            if(cart.length === 0) {
                itemsContainer.innerHTML = '<p class="text-center text-gray-500 my-8">Səbəsiniz boşdur.</p>';
                return;
            }
            itemsContainer.innerHTML = cart.map(item => `
                <div class="flex items-center gap-3 p-2 bg-white rounded-lg border">
                    <img src="${item.img}" class="w-14 h-14 object-cover rounded">
                    <div class="flex-1 min-w-0">
                        <h5 class="text-xs font-semibold text-gray-800 truncate">${item.title}</h5>
                        <p class="text-sm font-bold text-indigo-600 mt-1">${item.price} ₼</p>
                    </div>
                    <div class="flex items-center gap-2 bg-gray-100 rounded px-2 py-1">
                        <button onclick="changeQuantity(${item.id}, -1)" class="text-gray-500 font-bold px-1">-</button>
                        <span class="text-xs font-bold">${item.quantity}</span>
                        <button onclick="changeQuantity(${item.id}, 1)" class="text-gray-500 font-bold px-1">+</button>
                    </div>
                </div>
            `).join('');
        }

        renderProducts(getProducts());
        updateCartUI();
    </script>
</body>
</html>
