<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZogram - Sosial Şəbəkə</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800">

    <!-- Üst Naviqasiya Paneli -->
    <header class="bg-white border-b sticky top-0 z-40">
        <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
            <h1 class="text-2xl font-black italic tracking-wider text-indigo-600">AZogram</h1>
            <div class="flex items-center gap-4 text-xl">
                <button onclick="openCreateModal()" class="hover:text-indigo-600 transition-colors" title="Yeni Paylaşım">
                    <i class="fa-regular fa-square-plus"></i>
                </button>
                <a href="profil.html" class="hover:text-indigo-600 transition-colors" title="Profil">
                    <i class="fa-regular fa-circle-user"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Əsas Məzmun Lentası -->
    <main class="max-w-xl mx-auto px-2 py-4 space-y-6">

        <!-- Hekayələr (Stories) Bölməsi -->
        <div class="bg-white border rounded-xl p-3 flex gap-4 overflow-x-auto no-scrollbar">
            <div class="flex flex-col items-center cursor-pointer flex-shrink-0">
                <div class="w-16 h-16 rounded-full ring-2 ring-indigo-500 p-0.5">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-full h-full object-cover rounded-full">
                </div>
                <span class="text-[11px] mt-1 text-gray-600 font-medium">Sənin hekayən</span>
            </div>
            <div class="flex flex-col items-center cursor-pointer flex-shrink-0">
                <div class="w-16 h-16 rounded-full ring-2 ring-pink-500 p-0.5">
                    <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" class="w-full h-full object-cover rounded-full">
                </div>
                <span class="text-[11px] mt-1 text-gray-600 font-medium">eliyev_1</span>
            </div>
            <div class="flex flex-col items-center cursor-pointer flex-shrink-0">
                <div class="w-16 h-16 rounded-full ring-2 ring-pink-500 p-0.5">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" class="w-full h-full object-cover rounded-full">
                </div>
                <span class="text-[11px] mt-1 text-gray-600 font-medium">Leyla</span>
            </div>
        </div>

        <!-- Postlar Siyahısı -->
        <div id="posts-container" class="space-y-6">
            <!-- JS vasitəsilə doldurulacaq -->
        </div>

    </main>

    <!-- Yeni Post Paylaşma Modalı -->
    <div id="create-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-gray-800">Yeni Paylaşım yarat</h3>
                <button onclick="closeCreateModal()" class="text-gray-400 hover:text-gray-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Şəkil Linki (URL)</label>
                    <input type="text" id="post-img" placeholder="https://images.unsplash.com/..." class="w-full bg-gray-50 border rounded-lg p-2.5 text-sm focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Açıqlama</label>
                    <textarea id="post-caption" placeholder="Şəkil haqqında nə düşünürsən?" class="w-full bg-gray-50 border rounded-lg p-2.5 text-sm focus:outline-none h-24"></textarea>
                </div>
                <button onclick="addNewPost()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors">
                    Paylaş
                </button>
            </div>
        </div>
    </div>

    <script>
        const defaultPosts = [
            {
                id: 1,
                username: 'rza_dev',
                userAvatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
                image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600',
                caption: 'Yeni veb layihə üzərində işləyirik! 💻🔥',
                likes: 42,
                isLiked: false,
                comments: [
                    { user: 'eliyev_1', text: 'Uğurlar dostum, əla görünür!' },
                    { user: 'leyla_b', text: 'Çox səliqəlidir 😍' }
                ]
            },
            {
                id: 2,
                username: 'baku_vibe',
                userAvatar: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=150',
                image: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600',
                caption: 'Həftəsonu dincəlmək üçün ən gözəl yer 🌊',
                likes: 128,
                isLiked: true,
                comments: [
                    { user: 'nicat_99', text: 'Haradır bura?' }
                ]
            }
        ];

        function getPosts() {
            const stored = localStorage.getItem('azogram_posts');
            return stored ? JSON.parse(stored) : defaultPosts;
        }

        function savePosts(posts) {
            localStorage.setItem('azogram_posts', JSON.stringify(posts));
            renderPosts();
        }

        function renderPosts() {
            const posts = getPosts();
            const container = document.getElementById('posts-container');

            container.innerHTML = posts.map(post => `
                <div class="bg-white border rounded-xl overflow-hidden shadow-sm">
                    <!-- Post Başlığı -->
                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-2">
                            <img src="${post.userAvatar}" class="w-8 h-8 rounded-full object-cover">
                            <span class="text-xs font-bold text-gray-800">${post.username}</span>
                        </div>
                        <i class="fa-solid fa-ellipsis text-gray-500 cursor-pointer"></i>
                    </div>

                    <!-- Post Şəkli -->
                    <img src="${post.image}" class="w-full h-80 object-cover">

                    <!-- Düymələr və bəyənmə -->
                    <div class="p-3 space-y-2">
                        <div class="flex items-center justify-between text-xl">
                            <div class="flex items-center gap-4">
                                <button onclick="toggleLike(${post.id})" class="transition-transform active:scale-125">
                                    <i class="fa-${post.isLiked ? 'solid text-red-500' : 'regular'} fa-heart"></i>
                                </button>
                                <button class="hover:text-gray-600"><i class="fa-regular fa-comment"></i></button>
                                <button class="hover:text-gray-600"><i class="fa-regular fa-paper-plane"></i></button>
                            </div>
                            <button class="hover:text-gray-600"><i class="fa-regular fa-bookmark"></i></button>
                        </div>

                        <p class="text-xs font-bold text-gray-900">${post.likes} bəyənmə</p>

                        <p class="text-xs text-gray-800">
                            <span class="font-bold mr-1">${post.username}</span> ${post.caption}
                        </p>

                        <!-- Şərhlər siyahısı -->
                        <div class="space-y-1 pt-1">
                            ${post.comments.map(c => `
                                <p class="text-xs text-gray-700">
                                    <span class="font-bold mr-1">${c.user}</span> ${c.text}
                                </p>
                            `).join('')}
                        </div>

                        <!-- Şərh yazma qutusu -->
                        <div class="flex items-center gap-2 pt-2 border-t mt-2">
                            <input type="text" id="comment-input-${post.id}" placeholder="Şərh yaz..." class="w-full text-xs bg-transparent focus:outline-none">
                            <button onclick="addComment(${post.id})" class="text-xs font-bold text-indigo-600 hover:text-indigo-800">Paylaş</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleLike(id) {
            let posts = getPosts();
            const post = posts.find(p => p.id === id);
            if(post) {
                if(post.isLiked) {
                    post.likes -= 1;
                    post.isLiked = false;
                } else {
                    post.likes += 1;
                    post.isLiked = true;
                }
                savePosts(posts);
            }
        }

        function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if(!text) return;

            let posts = getPosts();
            const post = posts.find(p => p.id === postId);
            if(post) {
                post.comments.push({ user: 'istifadeci', text: text });
                savePosts(posts);
                input.value = '';
            }
        }

        function openCreateModal() {
            document.getElementById('create-modal').classList.remove('hidden');
        }

        function closeCreateModal() {
            document.getElementById('create-modal').classList.add('hidden');
        }

        function addNewPost() {
            const img = document.getElementById('post-img').value.trim();
            const caption = document.getElementById('post-caption').value.trim();

            if(!img || !caption) {
                alert('Zəhmət olmasa şəkil linkini və açıqlamanı daxil edin.');
                return;
            }

            let posts = getPosts();
            const newPost = {
                id: Date.now(),
                username: 'senin_profilin',
                userAvatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
                image: img,
                caption: caption,
                likes: 0,
                isLiked: false,
                comments: []
            };

            posts.unshift(newPost);
            savePosts(posts);
            closeCreateModal();

            document.getElementById('post-img').value = '';
            document.getElementById('post-caption').value = '';
        }

        renderPosts();
    </script>
</body>
</html>
