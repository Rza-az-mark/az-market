<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Market - Satıcı Qeydiyyatı</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-white border-b py-4 px-6 flex justify-between items-center">
        <a href="./index.html" class="text-2xl font-bold text-indigo-600">AZ Market</a>
        <a href="./index.html" class="text-sm text-gray-600 hover:text-indigo-600 font-medium">← Sayta qayıt</a>
    </header>

    <main class="max-w-xl mx-auto px-4 py-8 w-full">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800 mb-2">AZ Market-də Satıcı Ol</h2>
            <p class="text-gray-500 text-sm mb-6">Öz mağazanızı açın və məhsullarınızı minlərlə alıcıya təqdim edin.</p>

            <form class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Mağaza Adı</label>
                    <input type="text" placeholder="məs: Baku Electronics" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Əlaqə Nömrəsi</label>
                    <input type="tel" placeholder="+994 50 000 00 00" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">E-poçt Ünvanı</label>
                    <input type="email" placeholder="example@mail.com" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">Məhsul Kateqoriyası</label>
                    <select class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        <option>Geyim və Dəb</option>
                        <option>Elektronika</option>
                        <option>Ev və Yaşam</option>
                        <option>Kosmetika</option>
                    </select>
                </div>
                <button type="button" class="w-full bg-green-600 text-white py-2.5 rounded-lg font-semibold text-sm hover:bg-green-700 transition">Müraciəti Göndər</button>
            </form>
        </div>
    </main>

    <footer class="text-center py-4 text-xs text-gray-400">
        © 2026 AZ Market. Bütün hüquqlar qorunur.
    </footer>

</body>
</html>
