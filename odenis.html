<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Market - Ödəniş və Sifariş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-2xl font-black text-indigo-600">AZ<span class="text-orange-500">Market</span></h1>
            <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-indigo-600 flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Səbətə qayıt
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
            <i class="fa-solid fa-credit-card text-indigo-600"></i> Sifarişin Rəsmiləşdirilməsi
        </h2>

        <div class="grid md:grid-cols-3 gap-6">
            
            <!-- Məlumat Forması -->
            <div class="md:col-span-2 space-y-6">
                <!-- Çatdırılma Ünvanı -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                    <h3 class="text-lg font-bold text-gray-800 border-b pb-2">1. Çatdırılma Ünvanı</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Ad və Soyad</label>
                            <input type="text" required placeholder="Əli Əliyev" class="w-full bg-gray-50 border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Telefon Nömrəsi</label>
                            <input type="tel" required placeholder="+994 50 000 00 00" class="w-full bg-gray-50 border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Şəhər / Rayon</label>
                        <select class="w-full bg-gray-50 border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option>Bakı</option>
                            <option>Sumqayıt</option>
                            <option>Gəncə</option>
                            <option>Xırdalan</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Dəqiq Ünvan (Küçə, ev/mənzil)</label>
                        <input type="text" required placeholder="Nizami küç. ev 12, mənzil 45" class="w-full bg-gray-50 border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <!-- Ödəniş Üsulu -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border space-y-4">
                    <h3 class="text-lg font-bold text-gray-800 border-b pb-2">2. Ödəniş Məlumatları</h3>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Kartın Üzərindəki Ad</label>
                        <input type="text" required placeholder="ALI ALIYEV" class="w-full bg-gray-50 border rounded-lg p-2.5 text-sm uppercase focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Kart Nömrəsi</label>
                        <input type="text" required maxlength="19" placeholder="0000 0000 0000 0000" class="w-full bg-gray-50 border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Bitmə Tarixi</label>
                            <input type="text" placeholder="MM/YY" maxlength="5" class="w-full bg-gray-50 border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">CVC / CVV</label>
                            <input type="password" maxlength="3" placeholder="***" class="w-full bg-gray-50 border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sifariş Xülasəsi -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border h-fit space-y-4">
                <h3 class="text-lg font-bold text-gray-800 border-b pb-2">Sifarişin Xülasəsi</h3>
                <div id="checkout-items" class="space-y-3 max-h-60 overflow-y-auto">
                    <!-- JS ilə dolacaq -->
                </div>
                <div class="border-t pt-3 space-y-2 text-sm text-gray-600">
                    <div class="flex justify-between">
                        <span>Məhsullar:</span>
                        <span id="subtotal">0 ₼</span>
                    </div>
                    <div class="flex justify-between">
                        <span>Çatdırılma:</span>
                        <span class="text-green-600 font-bold">PULSUZ</span>
                    </div>
                    <div class="flex justify-between text-base font-bold text-gray-900 border-t pt-2">
                        <span>Yekun Məbləğ:</span>
                        <span id="final-total" class="text-indigo-600">0 ₼</span>
                    </div>
                </div>
                <button onclick="completeOrder()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl shadow transition-colors">
                    Sifarişi Təsdiqlə və Ödə
                </button>
            </div>

        </div>
    </main>

    <script>
        function loadCheckout() {
            const cart = JSON.parse(localStorage.getItem('az_market_cart')) || [];
            const container = document.getElementById('checkout-items');
            
            if (cart.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-500">Səbətiniz boşdur.</p>';
                document.getElementById('subtotal').innerText = '0 ₼';
                document.getElementById('final-total').innerText = '0 ₼';
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="flex justify-between items-center text-xs">
                    <span class="font-medium text-gray-800 truncate max-w-[150px]">${item.title} (x${item.quantity})</span>
                    <span class="font-bold text-gray-900">${item.price * item.quantity} ₼</span>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('subtotal').innerText = total + ' ₼';
            document.getElementById('final-total').innerText = total + ' ₼';
        }

        function completeOrder() {
            const cart = JSON.parse(localStorage.getItem('az_market_cart')) || [];
            if(cart.length === 0) {
                alert('Səbətiniz boşdur!');
                return;
            }
            alert('🎉 Sifarişiniz uğurla rəsmiləşdirildi! Təşəkkür edirik.');
            localStorage.removeItem('az_market_cart');
            window.location.href = 'index.html';
        }

        loadCheckout();
    </script>
</body>
</html>
