<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Market - Sifarişlərim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-2xl font-black text-indigo-600">AZ<span class="text-orange-500">Market</span></h1>
            <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-indigo-600 flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Ana səhifəyə qayıt
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-box-archive text-indigo-600"></i> Sifariş Tarixçəniz
        </h2>

        <div id="orders-container" class="space-y-4">
            <!-- JS ilə dolacaq -->
        </div>
    </main>

    <script>
        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('az_market_orders')) || [];
            const container = document.getElementById('orders-container');

            if (orders.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 py-12 bg-white rounded-2xl border shadow-sm">Hələ heç bir sifariş verməmisiniz.</p>';
                return;
            }

            container.innerHTML = orders.map(order => `
                <div class="bg-white rounded-2xl shadow-sm border p-6 space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-3 gap-2">
                        <div>
                            <span class="text-xs text-gray-400">Sifariş №: #${order.id}</span>
                            <p class="text-xs font-semibold text-gray-600">Tarix: ${order.date}</p>
                        </div>
                        <span class="bg-orange-100 text-orange-700 text-xs font-bold px-3 py-1 rounded-full">${order.status}</span>
                    </div>

                    <div class="space-y-2">
                        <p class="text-xs font-bold text-gray-700">Məhsullar:</p>
                        <div class="space-y-1">
                            ${order.items.map(i => `
                                <div class="flex justify-between items-center text-xs text-gray-600 bg-gray-50 p-2 rounded-lg">
                                    <span>${i.title} (x${i.quantity})</span>
                                    <span class="font-bold text-gray-900">${i.price * i.quantity} ₼</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="flex justify-between items-center pt-2 border-t text-sm font-bold">
                        <span class="text-gray-600">Ümumi Məbləğ:</span>
                        <span class="text-indigo-600 text-base">${order.total} ₼</span>
                    </div>
                </div>
            `).join('');
        }

        loadOrders();
    </script>
</body>
</html>
