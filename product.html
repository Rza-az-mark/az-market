<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Market - Məhsul Haqqında</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-bold text-indigo-600">AZ Market</a>
            <a href="index.html" class="text-sm text-gray-600 hover:text-indigo-600">← Ana Səhifə</a>
        </div>
    </header>

    <!-- Məhsul Detalları -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Şəkil Sahəsi -->
            <div class="w-full h-64 md:h-96 bg-gray-200 rounded-xl flex items-center justify-center text-gray-400 font-medium">
                Məhsulun Şəkli
            </div>

            <!-- Məhsul Məlumatları -->
            <div class="flex flex-col justify-between">
                <div>
                    <span class="text-xs font-semibold bg-indigo-100 text-indigo-800 px-2.5 py-1 rounded">TrendyStore</span>
                    <h2 class="text-2xl font-bold text-gray-800 mt-3">Kabelsiz Qulaqlıq (Bluetooth 5.3)</h2>
                    <p class="text-2xl font-extrabold text-indigo-600 mt-2">49.99 AZN</p>
                    
                    <div class="mt-6 border-t pt-4">
                        <h3 class="font-bold text-gray-700 mb-2">Məhsul haqqında:</h3>
                        <p class="text-sm text-gray-600 leading-relaxed">
                            Yüksək səs keyfiyyəti, kənar küyü boğma (ANC) funksiyası və 24 saatlıq batareya ömrü ilə gün boyu rahat istifadə təmin edir. Bütün iOS və Android cihazları ilə tam uyğundur.
                        </p>
                    </div>
                </div>

                <!-- Düymələr -->
                <div class="mt-8 flex gap-4">
                    <button class="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">Səbətə Əlavə Et</button>
                    <button class="flex-1 bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition">İndi Al</button>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
