<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ Market - Məhsul Detalları və Rəylər</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-2xl font-black text-indigo-600">AZ<span class="text-orange-500">Market</span></h1>
            <a href="index.html" class="text-sm font-semibold text-gray-600 hover:text-indigo-600 flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Ana səhifəyə qayıt
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">
        <!-- Məhsul Kartı Detalı -->
        <div id="product-detail-container" class="bg-white rounded-2xl shadow-sm p-6 grid md:grid-cols-2 gap-8 items-start">
            <!-- JS ilə dolacaq -->
        </div>

        <!-- Məhsul Rəyləri Bölməsi -->
        <div class="bg-white rounded-2xl shadow-sm p-6 space-y-6">
            <h3 class="text-lg font-bold text-gray-800 border-b pb-3 flex items-center gap-2">
                <i class="fa-solid fa-comments text-indigo-600"></i> Məhsul Rəyləri və Qiymətləndirmə
            </h3>

            <!-- Rəy Yazma Forması -->
            <form onsubmit="handleReviewSubmit(event)" class="space-y-4 bg-gray-50 p-4 rounded-xl border">
                <h4 class="text-sm font-bold text-gray-700">Rəy Bildir</h4>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-gray-500">Qiymətiniz:</span>
                    <select id="review-rating" class="bg-white border rounded p-1 text-xs font-bold text-amber-500">
                        <option value="5">★★★★★ (5)</option>
                        <option value="4">★★★★☆ (4)</option>
                        <option value="3">★★★☆☆ (3)</option>
                        <option value="2">★★☆☆☆ (2)</option>
                        <option value="1">★☆☆☆☆ (1)</option>
                    </select>
                </div>
                <div>
                    <input type="text" id="review-author" required placeholder="Adınız və Soyadınız" class="w-full bg-white border rounded-lg p-2 text-xs mb-2">
                    <textarea id="review-text" required rows="3" placeholder="Məhsul haqqında təəssüratlarınızı yazın..." class="w-full bg-white border rounded-lg p-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-lg text-xs transition-colors">
                    Rəyi Göndər
                </button>
            </form>

            <!-- Rəylərin Siyahısı -->
            <div id="reviews-list" class="space-y-3">
                <!-- Dinamik dolacaq -->
            </div>
        </div>
    </main>

    <script>
        const defaultProducts = [
            { id: 1, title: 'Simsiz Qulaqlıq Bluetooth 5.0', price: 36, category: 'Elektronika', store: 'TechStore', rating: 4.8, img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800', desc: 'Yüksək səs keyfiyyəti, 20 saat batareya ömrü və rahat dizayn.' },
            { id: 2, title: 'Klassik Qol Saatı (Dəri Kəmər)', price: 89, category: 'Geyim & Moda', store: 'TimeKeeper', rating: 4.6, img: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800', desc: 'Suya davamlı, həqiqi dəri kəmərli zərif bəy saatı.' },
            { id: 3, title: 'Qırmızı İdman Ayaqqabısı', price: 102, category: 'Geyim & Moda', store: 'SportZone', rating: 4.9, img: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800', desc: 'Ortopedik altlıq, nəfəs alan parça.' },
            { id: 4, title: 'Studio Səs Qulaqlığı', price: 145, category: 'Elektronika', store: 'AudioPro', rating: 4.7, img: 'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=800', desc: 'Peşəkar studiya səsi və səsboğucu mexanizm.' }
        ];

        function getProducts() {
            const stored = localStorage.getItem('az_market_products');
            return stored ? JSON.parse(stored) : defaultProducts;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const prodId = parseInt(urlParams.get('id')) || 1;
        const products = getProducts();
        const product = products.find(p => p.id === prodId) || products[0];

        // Favorit yoxlaması
        function checkIsFavorite(id) {
            const favs = JSON.parse(localStorage.getItem('az_market_wishlist')) || [];
            return favs.some(f => f.id === id);
        }

        function toggleWishlist() {
            let favs = JSON.parse(localStorage.getItem('az_market_wishlist')) || [];
            const index = favs.findIndex(f => f.id === product.id);
            if (index > -1) {
                favs.splice(index, 1);
                alert('Favoritlərdən çıxarıldı.');
            } else {
                favs.push(product);
                alert('Favoritlərə əlavə edildi! ❤️');
            }
            localStorage.setItem('az_market_wishlist', JSON.stringify(favs));
            renderProductDetail();
        }

        function renderProductDetail() {
            const isFav = checkIsFavorite(product.id);
            document.getElementById('product-detail-container').innerHTML = `
                <img src="${product.img}" class="w-full h-80 object-cover rounded-xl border">
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-indigo-600 uppercase tracking-wide bg-indigo-50 px-3 py-1 rounded-full">${product.store || 'AZ Market Satıcısı'}</span>
                        <button onclick="toggleWishlist()" class="text-xl ${isFav ? 'text-red-500' : 'text-gray-400'} hover:text-red-500 transition-colors">
                            <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                        </button>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-900">${product.title}</h2>
                    <div class="flex items-center gap-2 text-amber-500 text-sm">
                        <i class="fa-solid fa-star"></i>
                        <span class="font-bold text-gray-700">${product.rating || '5.0'}</span>
                        <span class="text-gray-400">| Kateqoriya: ${product.category}</span>
                    </div>
                    <p class="text-gray-600 text-sm leading-relaxed">${product.desc || 'Keyfiyyətli məhsul zəmanəti ilə.'}</p>
                    <div class="text-3xl font-extrabold text-gray-900 pt-2">${product.price} ₼</div>
                    <button onclick="addToCartAndGo()" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3.5 rounded-xl shadow transition-colors flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cart-plus"></i> Səbətə Əlavə Et
                    </button>
                </div>
            `;
        }

        function addToCartAndGo() {
            let cart = JSON.parse(localStorage.getItem('az_market_cart')) || [];
            const existing = cart.find(item => item.id === product.id);
            if(existing) { existing.quantity += 1; }
            else { cart.push({ id: product.id, title: product.title, price: product.price, img: product.img, quantity: 1 }); }
            localStorage.setItem('az_market_cart', JSON.stringify(cart));
            alert('Məhsul səbətə əlavə edildi!');
            window.location.href = 'index.html';
        }

        // Rəylər sistemi
        function getReviews() {
            const allReviews = JSON.parse(localStorage.getItem('az_market_reviews')) || {};
            return allReviews[product.id] || [
                { author: 'Leyla Məmmədova', rating: 5, text: 'Çox bəyəndim, keyfiyyəti əladır.', date: '02.06.2026' },
                { author: 'Rauf Əliyev', rating: 4, text: 'Tez çatdırıldı, təşəkkürlər.', date: '01.06.2026' }
            ];
        }

        function renderReviews() {
            const reviews = getReviews();
            const container = document.getElementById('reviews-list');
            container.innerHTML = reviews.map(r => `
                <div class="bg-gray-50 p-3 rounded-xl border text-xs space-y-1">
                    <div class="flex justify-between font-bold text-gray-800">
                        <span>${r.author}</span>
                        <span class="text-amber-500">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</span>
                    </div>
                    <p class="text-gray-600">${r.text}</p>
                    <span class="text-[10px] text-gray-400 block text-right">${r.date}</span>
                </div>
            `).join('');
        }

        function handleReviewSubmit(e) {
            e.preventDefault();
            const author = document.getElementById('review-author').value;
            const text = document.getElementById('review-text').value;
            const rating = parseInt(document.getElementById('review-rating').value);
            
            const allReviews = JSON.parse(localStorage.getItem('az_market_reviews')) || {};
            if(!allReviews[product.id]) allReviews[product.id] = getReviews();

            allReviews[product.id].unshift({
                author,
                text,
                rating,
                date: new Date().toLocaleDateString()
            });

            localStorage.setItem('az_market_reviews', JSON.stringify(allReviews));
            renderReviews();
            e.target.reset();
            alert('Rəyiniz uğurla əlavə olundu!');
        }

        renderProductDetail();
        renderReviews();
    </script>
</body>
</html>
